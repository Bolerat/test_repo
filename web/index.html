  <div class="phone">
    <header class="topbar">
      <div class="brand"><svg class="brand-paw"><use href="#i-paw"/></svg><span>同窝</span></div>
      <button class="chip" id="petChip" type="button" data-action="goto-pet"></button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="主导航">
      <button type="button" data-action="nav" data-route="today" class="tab">
        <svg><use href="#i-paw"/></svg><span>今日</span>
      </button>
      <button type="button" data-action="nav" data-route="journal" class="tab">
        <svg><use href="#i-book"/></svg><span>记录</span>
      </button>
      <button type="button" data-action="nav" data-route="ai" class="tab">
        <svg><use href="#i-wand"/></svg><span>AI 助手</span>
      </button>
      <button type="button" data-action="nav" data-route="pet" class="tab">
        <svg><use href="#i-cat"/></svg><span>宠物</span>
      </button>
      <button type="button" data-action="nav" data-route="me" class="tab">
        <svg><use href="#i-user"/></svg><span>我的</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <input hidden id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="选择照片">
  <input hidden id="importInput" type="file" accept="application/json,.json" aria-label="导入数据文件">

  <script type="module" src="js/app.js"></script>

</html>
